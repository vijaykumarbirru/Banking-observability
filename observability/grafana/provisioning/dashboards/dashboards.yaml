# Loads every dashboard JSON from /etc/grafana/dashboards into the "VijayBank" folder.
apiVersion: 1
providers:
  - name: vijaybank
    folder: VijayBank
    type: file
    allowUiUpdates: true   # you can edit in the UI; export JSON back to the repo to keep changes
    options:
      path: /etc/grafana/dashboards
