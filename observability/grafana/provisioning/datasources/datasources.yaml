      password: grafana_ro_pw

  - name: "PG Auth"
    uid: pg-auth
    type: grafana-postgresql-datasource
    url: postgres:5432
    user: grafana_ro
    jsonData:
      database: auth
      sslmode: disable
      postgresVersion: 1600
    secureJsonData:
      password: grafana_ro_pw

  - name: "PG Ledger"
    uid: pg-ledger
    type: grafana-postgresql-datasource
    url: postgres:5432
    user: grafana_ro
    jsonData:
      database: ledger
      sslmode: disable
      postgresVersion: 1600
    secureJsonData:
      password: grafana_ro_pw

