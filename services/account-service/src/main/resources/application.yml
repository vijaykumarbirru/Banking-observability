server:
  port: ${PORT:8083}

spring:
  application:
    name: account-service
  main:
    banner-mode: off
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://postgres:5432/account}
    username: ${DATABASE_USER:account_svc}
    password: ${DATABASE_PASSWORD:account_pw}
  sql:
    init:
      mode: always
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    username: ${RABBITMQ_USER:vijaybank}
    password: ${RABBITMQ_PASSWORD:vijaybank_pw}
    publisher-confirm-type: simple

logging:
  structured:
    format:
      console: logstash

vijaybank:
  ledger-url: ${LEDGER_URL:http://ledger-service:8084}
