server:
  port: ${PORT:8081}

spring:
  application:
    name: auth-service
  main:
    banner-mode: off
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://postgres:5432/auth}
    username: ${DATABASE_USER:auth_svc}
    password: ${DATABASE_PASSWORD:auth_pw}
  sql:
    init:
      mode: always
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: 6379
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    username: ${RABBITMQ_USER:vijaybank}
    password: ${RABBITMQ_PASSWORD:vijaybank_pw}
    publisher-confirm-type: simple

logging:
  structured:
    format:
      console: logstash

vijaybank:
  auth:
    access-token-ttl: 5m
    refresh-token-ttl: 30m
    otp-ttl: 5m
    otp-max-attempts: 3
    max-failed-logins: 5
    lock-duration: 30m
